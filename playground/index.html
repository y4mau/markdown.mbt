<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%84%3C/text%3E%3C/svg%3E">
  <title>Markdown.mbt Playground</title>
  <script>
    // Apply theme immediately to prevent flash
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f6f6f6;
      --bg-tertiary: #eeeeee;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --border-color: #e0e0e0;
      --accent-color: #0066cc;
      --code-bg: #eaeaea;
    }

    [data-theme="dark"] {
      --bg-primary: #1a1a1a;
      --bg-secondary: #242424;
      --bg-tertiary: #2d2d2d;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --border-color: #404040;
      --accent-color: #66b3ff;
      --code-bg: #2d2d2d;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.2s, color 0.2s;
    }

    #app {
      height: 100%;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .view-mode-buttons,
    .editor-mode-buttons {
      display: flex;
      gap: 4px;
      background: var(--bg-tertiary);
      padding: 4px;
      border-radius: 6px;
    }

    .view-mode-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 28px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .view-mode-btn:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .view-mode-btn.active {
      background: var(--bg-primary);
      color: var(--accent-color);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-tertiary);
      padding: 4px;
      border-radius: 6px;
    }

    .file-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: rtl;
      text-align: left;
    }

    .file-path-dir {
      font-weight: 400;
      color: var(--text-secondary);
    }

    .copy-path-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 2px;
      margin-left: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      opacity: 0.5;
      transition: opacity 0.15s, color 0.15s;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .copy-path-btn:hover {
      opacity: 1;
      background: var(--bg-secondary);
    }

    .copy-path-btn.copied {
      opacity: 1;
      color: #3fb950;
    }

    .save-status {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .save-status.saving {
      color: var(--text-secondary);
    }

    .save-status.saved {
      color: #3fb950;
      font-weight: 600;
    }

    .save-status.idle {
      color: #d29922;
    }

    .save-status.error {
      color: #f85149;
      font-weight: 600;
    }

    .toolbar-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 28px;
      border: none;
      border-radius: 4px;
      background: var(--bg-primary);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      transition: background-color 0.15s, color 0.15s, box-shadow 0.15s;
    }

    .toolbar-action-btn:hover {
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }

    /* Document switcher sidebar */
    .doc-switcher-sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      display: none;
      flex-direction: column;
    }

    .doc-switcher-sidebar.floating {
      position: absolute;
      top: 8px;
      left: 8px;
      bottom: 8px;
      z-index: 50;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.08);
      transform: translateX(-110%);
      opacity: 0;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
      pointer-events: none;
    }

    .doc-switcher-sidebar.floating.visible {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    [data-theme="dark"] .doc-switcher-sidebar.floating {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .doc-switcher-header {
      padding: 10px 12px 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .doc-switcher-empty {
      padding: 24px 12px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .doc-switcher-list {
      padding: 4px 0;
      flex: 1;
      overflow-y: auto;
    }

    .doc-switcher-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      cursor: pointer;
      transition: background-color 0.1s, transform 0.25s ease, opacity 0.25s ease;
    }

    .doc-switcher-item.flip-move {
      transition: transform 0.25s ease;
    }

    .doc-switcher-item.flip-enter {
      opacity: 0;
      transform: translateX(-20px);
    }

    .doc-switcher-item.flip-enter-active {
      opacity: 1;
      transform: translateX(0);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .doc-switcher-item.flip-exit {
      opacity: 0;
      transform: translateX(20px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .doc-switcher-item:hover,
    .doc-switcher-item.focused {
      background: var(--bg-tertiary);
    }

    .doc-switcher-item.active {
      background: var(--bg-primary);
    }

    .doc-switcher-item.active::before {
      content: "";
      display: block;
      width: 3px;
      height: 24px;
      border-radius: 2px;
      background: var(--accent-color);
      flex-shrink: 0;
    }

    .doc-switcher-item.disabled {
      opacity: 0.5;
      cursor: default;
    }

    .doc-switcher-item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .doc-switcher-item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-switcher-item-path {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-switcher-item-remove {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      opacity: 0;
      flex-shrink: 0;
      transition: opacity 0.1s, background-color 0.1s, color 0.1s;
    }

    .doc-switcher-item:hover .doc-switcher-item-remove,
    .doc-switcher-item.focused .doc-switcher-item-remove {
      opacity: 1;
    }

    .doc-switcher-item-remove:hover {
      background: var(--border-color);
      color: var(--text-primary);
    }

    @media (max-width: 768px) {
      .doc-switcher-sidebar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 50;
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.15);
      }

      [data-theme="dark"] .doc-switcher-sidebar {
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.4);
      }
    }

    /* Content area wraps sidebar + main container */
    .content-area {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .container.view-editor .editor,
    .container.view-preview .preview {
      flex: 1;
      max-width: 2300px;
      margin: 0 auto;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    /* Mobile: full width, no borders for single-pane modes */
    @media (max-width: 768px) {
      .container.view-editor .editor,
      .container.view-preview .preview {
        max-width: 100%;
        border-left: none;
        border-right: none;
      }
    }

    .editor, .preview {
      flex: 1;
      padding: 16px;
      overflow: auto;
    }

    .container.view-editor .editor {
      border-right: none;
    }

    .container.view-editor,
    .container.view-preview {
      justify-content: center;
    }

    /* View mode visibility */
    .container.view-preview .editor {
      display: none;
    }

    .container.view-editor .preview {
      display: none;
    }

    /* Editor mode visibility */
    .editor-highlight-wrapper,
    .editor-simple-wrapper {
      display: none;
      flex: 1;
      min-height: 0;
    }

    .editor-mode-highlight .editor-highlight-wrapper {
      display: flex;
    }

    .editor-mode-simple .editor-simple-wrapper {
      display: flex;
    }

    .editor {
      border-right: 1px solid var(--border-color);
      background: var(--bg-primary);
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Syntax Highlight Editor Styles */
    .syntax-editor-container {
      display: flex;
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
    }

    .line-numbers {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 16px 0;
      text-align: right;
      user-select: none;
      font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.5;
      min-width: 50px;
      border-right: 1px solid var(--border-color);
    }

    .line-numbers .line-number {
      padding: 0 12px 0 8px;
    }

    .editor-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .editor-content {
      position: relative;
      width: 100%;
      max-width: 900px;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    @media (max-width: 768px) {
      .editor-content {
        max-width: 100%;
        border-left: none;
        border-right: none;
      }
    }

    .editor-textarea,
    .editor-highlight {
      font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.5;
      padding: 16px 16px 50vh 24px;
      margin: 0;
      border: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      tab-size: 2;
    }

    .editor-textarea {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: transparent;
      caret-color: var(--text-primary);
      resize: none;
      outline: none;
      z-index: 2;
    }

    .editor-textarea::selection {
      background: rgba(56, 139, 253, 0.3);
    }

    .editor-highlight {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 100%;
      pointer-events: none;
      z-index: 1;
      color: var(--text-primary);
    }

    .highlight-line {
      min-height: 1.5em; /* Match line-height */
    }

    .highlight-line:empty::after {
      content: "\00a0"; /* Non-breaking space for empty lines */
    }

    /* Simple editor (plain textarea) */
    .editor-simple-wrapper {
      justify-content: center;
    }

    .simple-editor {
      width: 100%;
      max-width: 900px;
      height: 100%;
      font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.5;
      padding: 16px;
      padding-bottom: 50vh;
      margin: 0;
      border: none;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      resize: none;
      outline: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      tab-size: 2;
    }

    @media (max-width: 768px) {
      .simple-editor {
        max-width: 100%;
        border-left: none;
        border-right: none;
      }
    }

    /* Markdown syntax colors - Light theme (high contrast) */
    /* NOTE: Do NOT use font-weight/font-style here - it causes cursor position mismatch
       because textarea and highlight overlay must have identical character widths */
    .md-heading { color: #b31d28; }
    .md-heading-marker { color: #b31d28; }
    .md-bold { color: #b31d28; }
    .md-italic { color: #0550ae; }
    .md-bold-italic { color: #b31d28; }
    .md-strikethrough { color: #57606a; text-decoration: line-through; }
    .md-code { color: #116329; background: rgba(27, 31, 35, 0.08); border-radius: 3px; }
    .md-code-marker { color: #57606a; }
    .md-fence { color: #57606a; }
    .md-fence-lang { color: #116329; }
    .md-link-text { color: #0550ae; }
    .md-link-url { color: #57606a; }
    .md-link-bracket { color: #57606a; }
    .md-image { color: #0550ae; }
    .md-list-marker { color: #b31d28; }
    .md-blockquote { color: #57606a; }
    .md-hr { color: #57606a; }
    .md-html { color: #57606a; }
    .md-escape { color: #57606a; }

    /* Markdown syntax colors - Dark theme */
    [data-theme="dark"] .md-heading { color: #ff7b72; }
    [data-theme="dark"] .md-heading-marker { color: #ff7b72; }
    [data-theme="dark"] .md-bold { color: #ff7b72; }
    [data-theme="dark"] .md-italic { color: #a5d6ff; }
    [data-theme="dark"] .md-bold-italic { color: #ff7b72; }
    [data-theme="dark"] .md-code { color: #7ee787; background: rgba(110, 118, 129, 0.2); }
    [data-theme="dark"] .md-code-marker { color: #8b949e; }
    [data-theme="dark"] .md-fence { color: #8b949e; }
    [data-theme="dark"] .md-fence-lang { color: #7ee787; }
    [data-theme="dark"] .md-link-text { color: #58a6ff; }
    [data-theme="dark"] .md-link-url { color: #8b949e; }
    [data-theme="dark"] .md-link-bracket { color: #8b949e; }
    [data-theme="dark"] .md-image { color: #58a6ff; }
    [data-theme="dark"] .md-list-marker { color: #ff7b72; }
    [data-theme="dark"] .md-blockquote { color: #8b949e; }
    [data-theme="dark"] .md-hr { color: #484f58; }
    [data-theme="dark"] .md-html { color: #8b949e; }
    [data-theme="dark"] .md-escape { color: #8b949e; }

    /* Light mode: map Lezer dark theme colors to light theme equivalents */
    /* Lezer outputs dark theme inline colors, we override them for light mode only */
    :root:not([data-theme="dark"]) .highlight-line span[style*="color: #ff7b72"] { color: #cf222e !important; }
    :root:not([data-theme="dark"]) .highlight-line span[style*="color: #ffa657"] { color: #953800 !important; }
    :root:not([data-theme="dark"]) .highlight-line span[style*="color: #d2a8ff"] { color: #8250df !important; }
    :root:not([data-theme="dark"]) .highlight-line span[style*="color: #a5d6ff"] { color: #0a3069 !important; }
    :root:not([data-theme="dark"]) .highlight-line span[style*="color: #79c0ff"] { color: #0550ae !important; }
    :root:not([data-theme="dark"]) .highlight-line span[style*="color: #7ee787"] { color: #116329 !important; }
    :root:not([data-theme="dark"]) .highlight-line span[style*="color: #8b949e"] { color: #6e7781 !important; }
    :root:not([data-theme="dark"]) .highlight-line span[style*="color: #c9d1d9"] { color: #24292f !important; }
    :root:not([data-theme="dark"]) .highlight-line span[style*="color: #e6edf3"] { color: #24292f !important; }

    /* Dark mode: Lezer's default colors are used (no override) */

    .preview {
      background: var(--bg-secondary);
    }

    .preview .markdown-body {
      max-width: 2200px;
      margin: 0 auto;
      line-height: 1.6;
      padding-bottom: 50vh;
    }

    /* Toolbar Copy All button */
    .toolbar-copy-all.copied {
      color: #3fb950 !important;
    }

    /* Section copy button inside headings */
    .preview .heading-with-copy {
      position: relative;
      display: flex;
      align-items: baseline;
    }

    .preview .heading-with-copy .section-copy-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background-color 0.15s, color 0.15s;
    }

    .preview .heading-with-copy:hover .section-copy-btn {
      opacity: 1;
    }

    .preview .heading-with-copy .section-copy-btn:hover {
      background: var(--border-color);
      color: var(--text-primary);
    }

    .preview .heading-with-copy .section-copy-btn .icon-check { display: none; }
    .preview .heading-with-copy .section-copy-btn.copied {
      opacity: 1;
      color: #3fb950;
    }
    .preview .heading-with-copy .section-copy-btn.copied .icon-copy { display: none; }
    .preview .heading-with-copy .section-copy-btn.copied .icon-check { display: inline; }

    /* Heading section wrapper */
    .preview .heading-section {
      border-radius: 6px;
      padding: 0 12px 2px;
      margin: 0 -12px;
      transition: background-color 0.15s;
    }

    /* Highlight entire section on copy button hover */
    .preview .heading-section.section-highlight {
      background: var(--bg-tertiary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .preview h1, .preview h2, .preview h3, .preview h4, .preview h5, .preview h6 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text-primary);
    }

    .preview h1 { font-size: 2em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
    .preview h2 { font-size: 1.5em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
    .preview h3 { font-size: 1.25em; }

    .preview p {
      margin-bottom: 16px;
    }

    .preview a {
      color: var(--accent-color);
      text-decoration: none;
    }

    .preview a:hover {
      text-decoration: underline;
    }

    /* Code block copy button */
    .preview .code-block-wrapper {
      position: relative;
      margin: 16px 0;
    }

    .preview .code-block-wrapper pre {
      margin: 0;
    }

    .preview .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background-color 0.15s, color 0.15s;
    }

    .preview .code-block-wrapper:hover .copy-btn {
      opacity: 1;
    }

    .preview .copy-btn:hover {
      background: var(--border-color);
      color: var(--text-primary);
    }

    .preview .copy-btn .icon-check {
      display: none;
    }

    .preview .copy-btn.copied {
      opacity: 1;
      color: #3fb950;
    }

    .preview .copy-btn.copied .icon-copy {
      display: none;
    }

    .preview .copy-btn.copied .icon-check {
      display: inline;
    }

    /* Rendered markdown code block (nested markdown preview) */
    .preview .rendered-markdown-block {
      position: relative;
      margin: 16px 0;
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-secondary);
    }

    .preview .rendered-markdown-block:hover > .copy-btn {
      opacity: 1;
    }

    .preview .rendered-markdown-block .mermaid-zoom-controls {
      right: auto;
      left: 8px;
    }

    .preview .rendered-markdown-block .rendered-markdown-block {
      background: var(--bg-tertiary);
      border-style: dashed;
    }

    .preview .rendered-markdown-block .rendered-markdown-block .rendered-markdown-block {
      background: var(--bg-primary);
      border-style: dotted;
    }

    .preview .rendered-markdown-block > :first-child {
      margin-top: 0;
    }

    .preview .rendered-markdown-block > :last-child {
      margin-bottom: 0;
    }

    .preview pre {
      background: var(--code-bg);
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 16px 0;
    }

    .preview code {
      font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
      font-size: 13px;
      background: var(--code-bg);
      padding: 0.2em 0.4em;
      border-radius: 3px;
    }

    .preview pre code {
      background: none;
      padding: 0;
    }

    /* Diff line highlighting for code blocks */
    .preview pre code:has(> .diff-line) {
      display: block;
      width: max-content;
      min-width: 100%;
    }

    .preview .diff-line {
      display: block;
      padding: 0 16px;
      margin: 0 -16px;
      border-left: 4px solid transparent;
    }

    .preview .diff-gutter {
      display: inline-block;
      width: 1ch;
      margin-right: 1ch;
      user-select: none;
      color: rgba(139, 148, 158, 0.6);
    }

    .preview .diff-line-add {
      background-color: rgba(46, 160, 67, 0.30);
      border-left-color: #3fb950;
    }

    .preview .diff-line-remove {
      background-color: rgba(248, 81, 73, 0.30);
      border-left-color: #f85149;
    }

    .preview .diff-line-hunk {
      background-color: rgba(56, 139, 253, 0.25);
      border-left-color: #388bfd;
      color: #79c0ff;
    }

    .preview .diff-line-header {
      background-color: rgba(110, 118, 129, 0.20);
      border-left-color: #6e7681;
      color: #8b949e;
      font-weight: bold;
    }

    .preview ul, .preview ol {
      padding-left: 2em;
      margin-bottom: 16px;
    }

    .preview li {
      margin-bottom: 4px;
    }

    .preview .task-list-item {
      list-style: none;
      margin-left: -1.5em;
    }

    .preview .task-list-item input[type="checkbox"] {
      margin-right: 8px;
    }

    .preview table {
      border-collapse: collapse;
      width: 100%;
    }

    .preview .table-resize-wrapper,
    .preview .table-chart-wrapper {
      width: 80%;
      max-width: 100%;
      margin: 16px auto;
      min-width: 200px;
    }

    .preview .table-resize-wrapper {
      resize: horizontal;
      overflow: auto;
    }

    .preview th, .preview td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    .preview th {
      background: var(--bg-tertiary);
      font-weight: 600;
    }

    /* Table chart visualization */
    .table-chart-wrapper {
      position: relative;
      padding-top: 30px;
      resize: horizontal;
      overflow: auto;
    }

    .table-chart-wrapper > table {
      margin: 0;
      width: 100%;
    }

    .table-chart-toolbar {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 10;
      padding: 2px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .table-chart-wrapper:hover .table-chart-toolbar,
    .table-chart-canvas-container:hover .table-chart-toolbar {
      opacity: 1;
      pointer-events: auto;
    }

    .table-chart-btn {
      width: 28px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .table-chart-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .table-chart-btn.active {
      color: var(--accent-color, #58a6ff);
      background: var(--bg-tertiary);
    }

    .table-chart-canvas-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      position: relative;
      resize: both;
      overflow: hidden;
      min-width: 200px;
      min-height: 150px;
    }

    .table-chart-chart-area {
      margin: 0;
    }

    .table-chart-group {
      width: fit-content;
      margin: 0 auto;
    }

    .table-chart-group .table-chart-toolbar {
      position: static;
      transform: none;
      margin-left: auto;
      width: fit-content;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .table-chart-group:hover .table-chart-toolbar {
      opacity: 1;
      pointer-events: auto;
    }

    .table-chart-group .table-chart-canvas-container {
      margin: 0;
    }

    .table-chart-render-target {
      margin: 0 auto;
    }

    .table-chart-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .table-chart-error {
      color: var(--text-secondary);
      font-size: 13px;
      padding: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .table-chart-config-popover {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      box-sizing: border-box;
    }

    .table-chart-config-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .table-chart-config-row input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }

    .table-chart-config-row label {
      color: var(--text-secondary);
      font-size: 12px;
      white-space: nowrap;
    }

    .table-chart-config-input {
      flex: 1;
      padding: 2px 6px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 12px;
      min-width: 0;
    }

    .table-chart-config-input:disabled {
      opacity: 0.4;
    }

    .preview blockquote {
      border-left: 4px solid var(--border-color);
      margin: 16px 0;
      padding: 0 16px;
      color: var(--text-secondary);
    }

    .preview hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 24px 0;
    }

    .preview img {
      max-width: 100%;
      height: auto;
    }

    .preview details {
      margin: 16px 0;
    }

    .preview details > summary {
      cursor: pointer;
      padding: 4px 0;
      font-weight: 500;
      list-style: revert;
    }

    /* Mermaid diagram */
    .mermaid-diagram-wrapper { margin: 16px 0; }
    .mermaid-rendered {
      display: block;
      position: relative;
      overflow: hidden;
      padding: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }
    .mermaid-zoom-viewport {
      width: 100%;
      transform-origin: 0 0;
      transition: transform 0.1s ease-out;
      line-height: 0;
    }
    .mermaid-zoom-viewport svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
    .mermaid-zoom-viewport.panning { transition: none; }
    .mermaid-rendered.zoomed { cursor: grab; }
    .mermaid-rendered.zoomed .mermaid-zoom-viewport.panning { cursor: grabbing; }
    .mermaid-rendered.zoomed.panning { cursor: grabbing; }
    .mermaid-zoom-controls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .mermaid-rendered:hover .mermaid-zoom-controls,
    .mermaid-rendered:focus-within .mermaid-zoom-controls {
      opacity: 1;
      pointer-events: auto;
    }
    .mermaid-rendered.zoomed .mermaid-zoom-controls {
      opacity: 0.7;
      pointer-events: auto;
    }
    .mermaid-zoom-btn {
      min-width: 28px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }
    .mermaid-zoom-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    .mermaid-zoom-btn:focus-visible {
      outline: 2px solid var(--text-secondary);
      outline-offset: -2px;
    }
    .mermaid-zoom-label {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      min-width: 40px;
      text-align: center;
      color: var(--text-secondary);
      user-select: none;
    }
    .mermaid-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .mermaid-error {
      border: 1px solid #f85149;
      border-radius: 6px;
      overflow: hidden;
    }
    .mermaid-error-message {
      padding: 8px 12px;
      background: rgba(248, 81, 73, 0.1);
      color: #f85149;
      font-size: 13px;
      font-family: monospace;
    }
    .mermaid-error-source {
      margin: 0;
      padding: 12px;
      background: var(--code-bg);
      font-size: 13px;
      overflow-x: auto;
    }
    .mermaid-error-source code { background: none; padding: 0; }

    /* Scroll sync highlight */
    .preview [data-span] {
      scroll-margin-top: 100px;
    }

    /* Responsive - only apply column layout for split view */
    @media (max-width: 768px) {
      .container.view-split {
        flex-direction: column;
      }

      .container.view-split .editor {
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        flex: 1;
        min-height: 0;
      }

      .container.view-split .preview {
        flex: 1;
        min-height: 0;
      }

      /* Single pane modes: full height */
      .container.view-editor .editor,
      .container.view-preview .preview {
        flex: 1;
        height: auto;
      }
    }

    /* === slide mode === */
    /* Ported from slidecraft styles.css; all ported classes prefixed `sld-`,
       colors adapted to the playground CSS custom properties / dark theme.
       `.slide-preview*`, `.slide-thumbnail*`, `.present-btn` are playground
       pane chrome (not ported). */

    /* --- View-mode layout: slide pane on the right, editor stays left --- */
    .slide-preview {
      display: none;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      background: var(--bg-primary);
    }

    .container.view-slide .preview {
      display: none;
    }

    .container.view-slide .slide-preview {
      display: flex;
      border-left: 1px solid var(--border-color);
    }

    .slide-preview-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-secondary);
    }

    .slide-preview-counter {
      font-size: 13px;
      color: var(--text-secondary);
      margin-left: auto;
    }

    .present-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .present-btn:hover {
      filter: brightness(1.1);
    }

    .slide-preview-main {
      padding: 16px;
      flex-shrink: 0;
    }

    .slide-preview-frame {
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .slide-preview-empty {
      color: var(--text-secondary);
      text-align: center;
      padding: 40px 16px;
      font-size: 14px;
    }

    .slide-thumbnails {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      padding: 0 16px 16px;
      align-content: start;
    }

    .slide-thumbnail {
      position: relative;
      padding: 0;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      background: none;
      cursor: pointer;
    }

    .slide-thumbnail:hover {
      border-color: var(--text-secondary);
    }

    .slide-thumbnail.selected {
      border-color: var(--accent-color);
    }

    .slide-thumbnail-frame {
      aspect-ratio: 16 / 9;
      pointer-events: none;
    }

    .slide-thumbnail-number {
      position: absolute;
      top: 4px;
      left: 6px;
      z-index: 1;
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      border-radius: 4px;
      padding: 0 4px;
    }

    /* --- Slide canvas (16:9 frame, container query units) --- */
    .sld-slide {
      container-type: size;
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sld-slide-content {
      width: 86cqw;
      max-height: 88cqh;
      display: flex;
      flex-direction: column;
      gap: 2.4cqh;
    }

    .sld-slide-content .markdown-body {
      display: flex;
      flex-direction: column;
      gap: 2.4cqh;
    }

    .sld-slide-content h1 {
      font-size: 7cqw;
      line-height: 1.2;
      margin: 0;
      background: linear-gradient(120deg, var(--text-primary), var(--accent-color));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sld-slide-content h2 {
      font-size: 5cqw;
      line-height: 1.25;
      margin: 0;
    }

    .sld-slide-content h3,
    .sld-slide-content h4,
    .sld-slide-content h5,
    .sld-slide-content h6 {
      font-size: 3.8cqw;
      margin: 0;
    }

    .sld-slide-content p,
    .sld-slide-content li {
      font-size: 3cqw;
      line-height: 1.6;
      margin: 0;
    }

    .sld-slide-content ul,
    .sld-slide-content ol {
      padding-left: 4cqw;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1cqh;
    }

    .sld-slide-content code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      background: var(--bg-tertiary);
      border-radius: 0.6cqw;
      padding: 0.2cqw 0.8cqw;
      font-size: 0.92em;
    }

    .sld-slide-content pre {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 1cqw;
      padding: 2cqw 2.5cqw;
      overflow: auto;
      margin: 0;
    }

    .sld-slide-content pre code {
      background: none;
      padding: 0;
      font-size: 2.2cqw;
      line-height: 1.55;
    }

    .sld-slide-content blockquote {
      border-left: 0.6cqw solid var(--accent-color);
      padding-left: 2.4cqw;
      margin: 0;
      color: var(--text-secondary);
      font-style: italic;
      font-size: 3cqw;
    }

    .sld-slide-content img {
      max-width: 100%;
      max-height: 50cqh;
      object-fit: contain;
      border-radius: 1cqw;
      align-self: center;
    }

    .sld-slide-content a {
      color: var(--accent-color);
    }

    /* Fragments (step-by-step reveal) */
    .sld-fragment {
      opacity: 0;
      transform: translateY(2.5cqh);
      transition: opacity 0.45s ease, transform 0.45s ease;
      display: flex;
      flex-direction: column;
      gap: 2.4cqh;
    }

    .sld-fragment.sld-visible {
      opacity: 1;
      transform: none;
    }

    /* --- Fullscreen player --- */
    .sld-player {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
      perspective: 1600px;
      z-index: 2000;
    }

    .sld-player.sld-laser-on {
      cursor: none;
    }

    .sld-frame {
      position: absolute;
      inset: 0;
    }

    .sld-anim-none {
      animation: none;
    }

    .sld-anim-fade {
      animation: sld-fade-in 0.55s ease both;
    }

    .sld-anim-slide.sld-dir-forward {
      animation: sld-slide-in-right 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .sld-anim-slide.sld-dir-backward {
      animation: sld-slide-in-left 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .sld-anim-zoom {
      animation: sld-zoom-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .sld-anim-flip {
      animation: sld-flip-in 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
      backface-visibility: hidden;
    }

    @keyframes sld-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes sld-slide-in-right {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    @keyframes sld-slide-in-left {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }

    @keyframes sld-zoom-in {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes sld-flip-in {
      from { transform: rotateY(-90deg); opacity: 0; }
      to { transform: rotateY(0); opacity: 1; }
    }

    .sld-effects-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .sld-blackout {
      position: fixed;
      inset: 0;
      background: #000;
      animation: sld-fade-in 0.3s ease both;
    }

    .sld-laser-dot {
      position: fixed;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f43f5e;
      box-shadow: 0 0 12px 6px rgb(244 63 94 / 60%);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .sld-progress-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgb(148 163 184 / 20%);
    }

    .sld-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-color), #4cc9f0);
      transition: width 0.3s ease;
    }

    .sld-controls {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.7rem;
      background: rgb(15 23 42 / 85%);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(6px);
      color: #e2e8f0;
    }

    .sld-controls.sld-visible {
      opacity: 1;
    }

    .sld-controls button {
      border: none;
      background: none;
      color: inherit;
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      line-height: 1;
      cursor: pointer;
      font-size: 1rem;
    }

    .sld-controls button:hover {
      background: rgb(148 163 184 / 20%);
    }

    .sld-controls button.sld-active {
      color: #f43f5e;
    }

    .sld-controls button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .sld-counter {
      color: #94a3b8;
      font-size: 0.85rem;
      padding: 0 0.4rem;
      white-space: nowrap;
    }

    .sld-help-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgb(15 23 42 / 95%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2rem 2.5rem;
      min-width: 22rem;
      backdrop-filter: blur(8px);
      color: #e2e8f0;
      z-index: 2100;
    }

    .sld-help-overlay h2 {
      font-size: 1.1rem;
      margin: 0 0 1rem;
      color: var(--accent-color);
    }

    .sld-help-overlay dl {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin: 0;
    }

    .sld-help-overlay dl > div {
      display: flex;
      justify-content: space-between;
      gap: 2rem;
    }

    .sld-help-overlay dt {
      font-family: monospace;
      color: #e2e8f0;
    }

    .sld-help-overlay dd {
      color: #94a3b8;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
