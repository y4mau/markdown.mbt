<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%84%3C/text%3E%3C/svg%3E">
  <title>Redirecting to Slide View - markdown.mbt</title>
  <script>
    // The standalone slide editor was merged into the main playground as a
    // "slide" view mode. Persist the slide view mode into the shared UI state
    // (localStorage key "markdown-editor-ui") and redirect to the playground,
    // preserving any ?file= query parameter.
    (function () {
      var UI_STATE_KEY = "markdown-editor-ui";
      try {
        var raw = localStorage.getItem(UI_STATE_KEY);
        var state = {};
        if (raw) {
          try { state = JSON.parse(raw) || {}; } catch (e) { state = {}; }
        }
        state.viewMode = "slide";
        localStorage.setItem(UI_STATE_KEY, JSON.stringify(state));
      } catch (e) {
        // localStorage unavailable; the playground falls back to defaults.
      }
      location.replace("/playground/" + location.search);
    })();
  </script>
</head>
<body>
  <noscript>
    JavaScript is required to redirect.
    <a href="/playground/">Open the playground</a> and choose the slide view mode (Ctrl+4).
  </noscript>
</body>
</html>
